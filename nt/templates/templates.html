<!--
  ☐11 模板库
  层：第五层 · UI 渲染
  ------------------------------------------------------------
  所有页面结构都集中在这里。index.html 只留容器，不再内联模板。
  由 js/ui/render-transactions.js 里的 loadTemplates() 一次注入到 <body>。

  约定（CODE-RULES.md）：
    · 不写任何内联事件（onclick 等）
    · 不写任何内联 style
    · 不写业务计算：{{ }} 之外只有结构
-->

<!-- 流水行：行内直接编辑（5 个可编辑格 + 序号 + 删除） -->
<template id="tpl-flow-row">
  <tr class="nt-row">
    <td class="nt-cell nt-cell-seq"></td>
    <td class="nt-cell nt-cell-date">
      <input class="nt-cell-input" type="text" inputmode="numeric" data-field="date" aria-label="日期">
    </td>
    <td class="nt-cell nt-cell-from">
      <input class="nt-cell-input" type="text" data-field="from" aria-label="转出账户">
    </td>
    <td class="nt-cell nt-cell-to">
      <input class="nt-cell-input" type="text" data-field="to" aria-label="转入账户">
    </td>
    <td class="nt-cell nt-cell-amount">
      <input class="nt-cell-input nt-cell-input-num" type="text" inputmode="decimal" data-field="amount" aria-label="金额">
    </td>
    <td class="nt-cell nt-cell-note">
      <input class="nt-cell-input" type="text" data-field="note" aria-label="备注">
    </td>
    <td class="nt-cell nt-cell-action">
      <button class="nt-btn nt-btn-icon" type="button" aria-label="删除这笔流水">×</button>
    </td>
  </tr>
</template>

<!-- 新增行：任何时候都在表格末尾，填了内容才建单 -->
<template id="tpl-flow-new">
  <tr class="nt-row nt-row-new" data-new="1">
    <td class="nt-cell nt-cell-seq">+</td>
    <td class="nt-cell nt-cell-date">
      <input class="nt-cell-input" type="text" inputmode="numeric" data-field="date" aria-label="日期" placeholder="260830">
    </td>
    <td class="nt-cell nt-cell-from">
      <input class="nt-cell-input" type="text" data-field="from" aria-label="转出账户" placeholder="转出">
    </td>
    <td class="nt-cell nt-cell-to">
      <input class="nt-cell-input" type="text" data-field="to" aria-label="转入账户" placeholder="转入">
    </td>
    <td class="nt-cell nt-cell-amount">
      <input class="nt-cell-input nt-cell-input-num" type="text" inputmode="decimal" data-field="amount" aria-label="金额" placeholder="0.00">
    </td>
    <td class="nt-cell nt-cell-note">
      <input class="nt-cell-input" type="text" data-field="note" aria-label="备注" placeholder="备注">
    </td>
    <td class="nt-cell nt-cell-action"></td>
  </tr>
</template>

<!-- 空状态 -->
<template id="tpl-empty">
  <tr class="nt-row">
    <td class="nt-cell nt-empty" colspan="7">还没有流水，先在上面记一笔</td>
  </tr>
</template>

<!-- 记一笔表单 -->
<template id="tpl-flow-form">
  <form class="nt-form" id="nt-form">
    <div class="nt-field">
      <label class="nt-label" for="nt-date">日期</label>
      <input class="nt-input" id="nt-date" name="date" type="date" required>
    </div>
    <div class="nt-field">
      <label class="nt-label" for="nt-from">转出</label>
      <select class="nt-input" id="nt-from" name="from" required></select>
    </div>
    <div class="nt-field">
      <label class="nt-label" for="nt-to">转入</label>
      <select class="nt-input" id="nt-to" name="to" required></select>
    </div>
    <div class="nt-field">
      <label class="nt-label" for="nt-amount">金额</label>
      <input class="nt-input" id="nt-amount" name="amount" type="text" inputmode="decimal" placeholder="0.00">
    </div>
    <div class="nt-field nt-field-wide">
      <label class="nt-label" for="nt-note">备注</label>
      <input class="nt-input" id="nt-note" name="note" type="text" placeholder="可选">
    </div>
    <button class="nt-btn nt-btn-primary" type="submit">记下</button>
  </form>
</template>

<!-- 密码锁屏（已有保险库：只解锁） -->
<template id="tpl-lock">
  <section class="nt-gate nt-gate-lock" aria-labelledby="nt-gate-title">
    <h2 class="nt-gate-title" id="nt-gate-title">解锁账本</h2>
    <form class="nt-gate-form" id="nt-lock-form">
      <label class="nt-visually-hidden" for="nt-lock-pw">密码</label>
      <input class="nt-input nt-gate-input" id="nt-lock-pw" type="password"
             autocomplete="current-password" placeholder="密码" required>
      <button class="nt-btn nt-btn-primary nt-gate-btn" type="submit">解锁</button>
    </form>
    <p class="nt-gate-msg" id="nt-lock-msg" role="status"></p>
  </section>
</template>

<!-- 首次设置密码（含"忘记即丢"强制确认） -->
<template id="tpl-lock-setup">
  <section class="nt-gate nt-gate-setup" aria-labelledby="nt-setup-title">
    <h2 class="nt-gate-title" id="nt-setup-title">设置密码</h2>
    <p class="nt-gate-hint">密码用来加密本机账本。数据只存在这台设备上，不上传任何服务器。</p>
    <form class="nt-gate-form" id="nt-setup-form">
      <label class="nt-visually-hidden" for="nt-setup-pw">密码</label>
      <input class="nt-input nt-gate-input" id="nt-setup-pw" type="password"
             autocomplete="new-password" placeholder="密码" required>
      <label class="nt-visually-hidden" for="nt-setup-pw2">再输一次</label>
      <input class="nt-input nt-gate-input" id="nt-setup-pw2" type="password"
             autocomplete="new-password" placeholder="再输一次" required>
      <label class="nt-gate-confirm">
        <input type="checkbox" id="nt-setup-ack">
        <span>我知道：忘记密码将永久丢失全部数据，没有任何找回途径</span>
      </label>
      <button class="nt-btn nt-btn-primary nt-gate-btn" type="submit" id="nt-setup-go" disabled>设置并进入</button>
    </form>
    <p class="nt-gate-msg" id="nt-setup-msg" role="status"></p>
  </section>
</template>
