<!--
  ☐11 模板库
  层：第五层 · UI 渲染
  ------------------------------------------------------------
  所有页面结构都集中在这里。index.html 只留容器，不再内联模板。
  由 js/ui/render-transactions.js 里的 loadTemplates() 一次注入到 <body>。

  约定（CODE-RULES.md）：
    · 不写任何内联事件（onclick 等）
    · 不写任何内联 style
    · 不写业务计算：{{ }} 之外只有结构
-->

<!-- 流水行：行内直接编辑（5 个可编辑格 + 序号 + 删除） -->
<!-- 路径 · 追踪列表行：日期 | 转出 | 转入 | 金额 -->
<template id="tpl-pw-row">
  <li class="pw-row">
    <span class="pw-cell pw-cell-date"></span>
    <span class="pw-cell pw-cell-from"></span>
    <span class="pw-cell pw-cell-to"></span>
    <span class="pw-cell pw-cell-amount"></span>
  </li>
</template>

<template id="tpl-flow-row">
  <tr class="nt-row">
    <td class="nt-cell nt-cell-seq"></td>
    <td class="nt-cell nt-cell-date">
      <input class="nt-cell-input" type="text" inputmode="numeric" data-field="date" aria-label="日期">
    </td>
    <td class="nt-cell nt-cell-from">
      <input class="nt-cell-input" type="text" data-field="from" aria-label="转出账户">
    </td>
    <td class="nt-cell nt-cell-to">
      <input class="nt-cell-input" type="text" data-field="to" aria-label="转入账户">
    </td>
    <td class="nt-cell nt-cell-amount">
      <input class="nt-cell-input nt-cell-input-num" type="text" inputmode="decimal" data-field="amount" aria-label="金额">
    </td>
    <td class="nt-cell nt-cell-note">
      <input class="nt-cell-input" type="text" data-field="note" aria-label="备注">
    </td>
    <td class="nt-cell nt-cell-fixed nt-cell-edge">
      <input class="nt-fixed-box" type="checkbox" aria-label="设为固定收支">
    </td>
    <td class="nt-cell nt-cell-action nt-cell-edge">
      <button class="nt-btn nt-btn-icon" type="button" aria-label="删除这笔流水">×</button>
    </td>
  </tr>
</template>

<!-- 新增行：任何时候都在表格末尾，填了内容才建单 -->
<template id="tpl-flow-new">
  <tr class="nt-row nt-row-new" data-new="1">
    <td class="nt-cell nt-cell-seq"></td>
    <td class="nt-cell nt-cell-date">
      <input class="nt-cell-input" type="text" inputmode="numeric" data-field="date" aria-label="日期">
    </td>
    <td class="nt-cell nt-cell-from">
      <input class="nt-cell-input" type="text" data-field="from" aria-label="转出账户">
    </td>
    <td class="nt-cell nt-cell-to">
      <input class="nt-cell-input" type="text" data-field="to" aria-label="转入账户">
    </td>
    <td class="nt-cell nt-cell-amount">
      <input class="nt-cell-input nt-cell-input-num" type="text" inputmode="decimal" data-field="amount" aria-label="金额">
    </td>
    <td class="nt-cell nt-cell-note">
      <input class="nt-cell-input" type="text" data-field="note" aria-label="备注">
    </td>
    <td class="nt-cell nt-cell-fixed nt-cell-edge"></td>
    <td class="nt-cell nt-cell-action nt-cell-edge"></td>
  </tr>
</template>

<!-- 空状态 -->
<template id="tpl-empty">
  <tr class="nt-row">
    <td class="nt-cell nt-empty" colspan="8">还没有流水，先在上面记一笔</td>
  </tr>
</template>

<!-- 记一笔表单 -->
<template id="tpl-flow-form">
  <form class="nt-form" id="nt-form">
    <div class="nt-field">
      <label class="nt-label" for="nt-date">日期</label>
      <input class="nt-input" id="nt-date" name="date" type="date" required>
    </div>
    <div class="nt-field">
      <label class="nt-label" for="nt-from">转出</label>
      <select class="nt-input" id="nt-from" name="from" required></select>
    </div>
    <div class="nt-field">
      <label class="nt-label" for="nt-to">转入</label>
      <select class="nt-input" id="nt-to" name="to" required></select>
    </div>
    <div class="nt-field">
      <label class="nt-label" for="nt-amount">金额</label>
      <input class="nt-input" id="nt-amount" name="amount" type="text" inputmode="decimal">
    </div>
    <div class="nt-field nt-field-wide">
      <label class="nt-label" for="nt-note">备注</label>
      <input class="nt-input" id="nt-note" name="note" type="text" placeholder="可选">
    </div>
    <button class="nt-btn nt-btn-primary" type="submit">记下</button>
  </form>
</template>

<!-- 统一弹窗骨架（NtModal 用；页面里不再手写遮罩与关闭按钮） -->
<template id="tpl-modal">
  <dialog class="nt-modal">
    <div class="nt-modal-shell">
      <span class="nt-modal-logo" aria-hidden="true">NT</span>
      <header class="nt-modal-head">
        <h2 class="nt-modal-title"></h2>
      </header>
      <button class="nt-modal-close" type="button" aria-label="关闭">×</button>
      <div class="nt-modal-body"></div>
      <footer class="nt-modal-actions"></footer>
    </div>
  </dialog>
</template>

<!-- 密码锁屏（已有保险库：只解锁） -->
<template id="tpl-lock">
  <section class="nt-gate nt-gate-lock" aria-labelledby="nt-gate-title">
    <h2 class="nt-gate-title" id="nt-gate-title">解锁账本</h2>
    <form class="nt-gate-form" id="nt-lock-form">
      <label class="nt-visually-hidden" for="nt-lock-pw">密码</label>
      <input class="nt-input nt-gate-input" id="nt-lock-pw" type="password"
             autocomplete="current-password" placeholder="密码" required>
      <!-- 提示词：紧贴在密码框下面一行，有内容才显示（不写「提示词：」前缀） -->
      <p class="nt-gate-pw-hint" id="nt-lock-hint" hidden></p>
      <button class="nt-btn nt-btn-primary nt-gate-btn" type="submit">解锁</button>
    </form>
    <p class="nt-gate-msg" id="nt-lock-msg" role="status"></p>
  </section>
</template>

<!-- 首次设置密码（含"忘记即丢"强制确认） -->
<template id="tpl-lock-setup">
  <section class="nt-gate nt-gate-setup" aria-labelledby="nt-setup-title">
    <h2 class="nt-gate-title" id="nt-setup-title">设置密码</h2>
    <p class="nt-gate-hint">密码用来加密本机账本。数据只存在这台设备上，不上传任何服务器。</p>
    <form class="nt-gate-form" id="nt-setup-form">
      <label class="nt-visually-hidden" for="nt-setup-pw">密码</label>
      <input class="nt-input nt-gate-input" id="nt-setup-pw" type="password"
             autocomplete="new-password" placeholder="密码" required>
      <label class="nt-visually-hidden" for="nt-setup-pw2">再输一次</label>
      <input class="nt-input nt-gate-input" id="nt-setup-pw2" type="password"
             autocomplete="new-password" placeholder="再输一次" required>
      <!-- 提示词（可选）：解锁时显示在密码框下面，忘了密码时给自己看 -->
      <label class="nt-visually-hidden" for="nt-setup-hint">提示词</label>
      <input class="nt-input nt-gate-input nt-gate-hint-input" id="nt-setup-hint" type="text"
             autocomplete="off" placeholder="提示词（可选）：忘了密码时给自己看">
      <label class="nt-gate-confirm">
        <input type="checkbox" id="nt-setup-ack">
        <span>我知道：忘记密码将永久丢失全部数据，没有任何找回途径</span>
      </label>
      <button class="nt-btn nt-btn-primary nt-gate-btn" type="submit" id="nt-setup-go" disabled>设置并进入</button>
    </form>
    <p class="nt-gate-msg" id="nt-setup-msg" role="status"></p>
  </section>
</template>

<!-- ============================================================
     统计 · 分类视图行：序 | 分类 | 转出金额 | 转入金额 | 当前余额 | 历史转出 | 历史转入 | 历史结余

    <td class="nt-cell nt-cell-num" data-field="out"></td>
    <td class="nt-cell nt-cell-num" data-field="iin"></td>
    <td class="nt-cell nt-cell-num" data-field="balance"></td>

    <td class="nt-cell nt-cell-num" data-field="histIn"></td>
    <td class="nt-cell nt-cell-num" data-field="histBalance"></td>

<!-- 统计 · 类型合计行（资产类合计 / 负债类合计 …） -->

    <td class="nt-cell nt-cell-num" data-field="out"></td>

    <td class="nt-cell nt-cell-num" data-field="histOut"></td>
    <td class="nt-cell nt-cell-num" data-field="histIn"></td>
    <td class="nt-cell nt-cell-num" data-field="histBalance"></td>
  </tr>
</template>

<!-- 统计 · 汇总视图行：账户名称 | 序号 | 类型 | 分类 | 转出金额 | 转入金额 | 当前余额 | 历史转出 | 历史转入 | 历史结余 -->

    <td class="nt-cell" data-field="name"></td>
    <td class="nt-cell nt-cell-seq" data-field="seq"></td>
    <td class="nt-cell" data-field="type"></td>
    <td class="nt-cell" data-field="category"></td>
    <td class="nt-cell nt-cell-num" data-field="out"></td>
    <td class="nt-cell nt-cell-num" data-field="iin"></td>
    <td class="nt-cell nt-cell-num" data-field="balance"></td>
    <td class="nt-cell nt-cell-num" data-field="histOut"></td>
    <td class="nt-cell nt-cell-num" data-field="histIn"></td>
    <td class="nt-cell nt-cell-num" data-field="histBalance"></td>
  </tr>
</template>

<!-- 查询 · 结果行：序 | 日期 | 转出 | 转入 | 金额 | 备注 -->
<template id="tpl-query-row">
  <tr class="nt-row">
    <td class="nt-cell nt-cell-seq" data-field="seq"></td>
    <td class="nt-cell" data-field="date"></td>
    <td class="nt-cell" data-field="from"></td>

<!-- 计划 · 固定收支行：序 | 频率 | 日期 | 转出 | 转入 | 金额 | 备注 | 本月 -->

    <td class="nt-cell">

    <td class="nt-cell">

<!-- 查询 · 一整段查询面板（A/B/C 各克隆一份，结构完全同构） -->
<template id="tpl-query-panel">
  <article class="nt-query-panel">
    <header class="nt-query-head">
      <span class="nt-query-title"></span>
      <button class="nt-btn nt-btn-sm" type="button" data-act="clear">清空</button>
      <span class="nt-query-total" data-total></span>
    </header>
    <div class="nt-tablewrap">
      <table class="nt-table nt-table-query">
        <colgroup>
          <col class="nt-c-q-seq">
          <col class="nt-c-q-date">
          <col class="nt-c-q-from">
          <col class="nt-c-q-to">
          <col class="nt-c-q-amount">
          <col class="nt-c-q-note">
        </colgroup>
        <thead>
            <!-- 筛选行：每个框就在自己那一列的格子里，列宽一变它跟着变 -->
