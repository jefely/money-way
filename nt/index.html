<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NT 账本</title>
  <meta name="theme-color" content="#14101f">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/flow.css">
  <link rel="stylesheet" href="./css/range.css">
  <link rel="stylesheet" href="./css/suggest.css">
  <link rel="stylesheet" href="./css/modal.css">
  <link rel="stylesheet" href="./css/import.css">
  <link rel="stylesheet" href="./css/gate.css">
  <link rel="stylesheet" href="./css/shell.css">
  <link rel="stylesheet" href="./css/query.css">
  <link rel="stylesheet" href="./css/validate.css">
  <link rel="stylesheet" href="./css/plan.css">
  <link rel="stylesheet" href="./css/settings.css">
  <link rel="stylesheet" href="./css/path.css">
  <link rel="stylesheet" href="./css/debug.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <!-- 门禁：锁屏 / 设置密码（由 ui/gate.js 注入模板） -->
  <div class="nt-gate-host" id="nt-gate" hidden></div>

  <!-- 单页壳：7-tab + 各自视图 + 页脚（应用名/版本由窗口标题栏显示） -->
  <div class="nt-app" id="nt-app" hidden>
    <nav class="nt-tabs" aria-label="主导航">
      <button class="nt-tab" type="button" data-tab="flow">流水</button>
      <button class="nt-tab" type="button" data-tab="stats">统计</button>
      <button class="nt-tab" type="button" data-tab="query">查询</button>
      <button class="nt-tab" type="button" data-tab="path">路径</button>
      <button class="nt-tab" type="button" data-tab="plan">固定</button>
      <button class="nt-tab" type="button" data-tab="settings">设置</button>
      <button class="nt-tab" type="button" data-tab="validate">校验</button>
    </nav>

    <main class="nt-main">
      <!-- ============ 流水：行内直接编辑，末尾固定一行「新增」 ============ -->
      <section class="nt-view" data-view="flow">
        <div class="nt-vbar">
          <span class="nt-vbar-title">流水记录</span>
          <button class="nt-btn nt-btn-sm" type="button" data-act="add">添加</button>
          <button class="nt-btn nt-btn-sm" type="button" data-act="sync">同步</button>
          <button class="nt-btn nt-btn-sm" type="button" data-act="import">导入</button>
          <button class="nt-btn nt-btn-sm" type="button" data-act="export">导出</button>
          <span class="nt-vbar-spacer"></span>
        </div>
        <div class="nt-tablewrap">
          <table class="nt-table nt-table-flow">

            <thead>
              <tr>
                <th class="nt-th nt-cell-seq" scope="col" data-col="seq">序</th>
                <th class="nt-th nt-cell-date" scope="col" data-col="date">日期</th>
                <th class="nt-th" scope="col" data-col="from">转出账户</th>
                <th class="nt-th" scope="col" data-col="to">转入账户</th>
                <th class="nt-th nt-cell-amount" scope="col" data-col="amount">金额</th>
                <th class="nt-th" scope="col" data-col="note">备注</th>
                <th class="nt-th nt-th-edge" scope="col" data-col="fixed" aria-label="固定收支"></th>
                <th class="nt-th nt-cell-action nt-th-edge" scope="col" data-col="action" aria-label="删除"></th>
              </tr>
            </thead>
            <tbody id="nt-flow-body"></tbody>
          </table>
        </div>
      </section>

      <!-- ============ 统计：分类 / 汇总 两个子视图 ============ -->
      <section class="nt-view" data-view="stats" hidden>
        <div class="nt-vbar">
          <span class="nt-vbar-title">分类统计</span>
          <div class="nt-caps" id="nt-stats-caps">
            <button class="nt-cap" type="button" data-cap="category" aria-selected="true">分类</button>
            <button class="nt-cap" type="button" data-cap="summary" aria-selected="false">汇总</button>
          </div>
          <span class="nt-vbar-spacer"></span>
          <button class="nt-btn nt-btn-sm" type="button" data-scope="all">清空</button>
          <div class="nt-caps" id="nt-stats-scope">
            <button class="nt-cap" type="button" data-scope="range">区间</button>
            <button class="nt-cap" type="button" data-scope="year">年份</button>
            <button class="nt-cap" type="button" data-scope="month">月份</button>
          </div>
        </div>
        <div class="nt-pills" id="nt-stats-pills" hidden></div>
        <div class="nt-tablewrap">
          <table class="nt-table nt-table-stats" id="nt-stats-table">
            <thead id="nt-stats-head"></thead>
            <tbody id="nt-stats-body"></tbody>
          </table>
        </div>
      </section>

      <!-- ============ 查询：三段独立查询表（模板克隆） ============ -->
      <section class="nt-view" data-view="query" hidden>
        <div class="nt-query-grid" id="nt-query-grid"></div>
      </section>

      <!-- ============ 路径：环网图在独立页打开（引擎/渲染已完成） ============ -->
      <section class="nt-view nt-view-path" data-view="path" hidden>
        <div class="pw-main">
          <!-- 左：追踪列表 -->
          <!-- 左：流水查询表（默认收起，点竖把手展开） -->
          <aside class="pw-side collapsed" id="pw-side">
            <button class="pw-rail" type="button" id="pw-rail" aria-label="展开流水表">流水表</button>

            <div class="pw-side-body" id="pw-side-body">
              <!-- 标题行只剩「清空」：标题「路径追踪」已由左上角常驻工具条
                   （三角 + 顺逆切换 + Money Way）取代，那一条不随侧栏收展隐藏 -->
              <div class="pw-side-head">
                <button class="pw-mini-btn" type="button" id="pw-clear">清空</button>
              </div>

              <!-- 滚动区：每一笔流水一行。冻结区（筛选行 + 列标行）现在住在它**里面**：
                   position:sticky;top:0 负责纵向钉住，横向跟随数据行一起滑。
                   以前冻结区在外面，列宽总和超出侧栏宽度时只有数据行能横滑，
                   表头钉在原地 —— 就是「列表行不随内容一起左右移动」。
                   注意：清空这里只能删 .pw-flow-row，不能 textContent=''，
                   否则表头会被一起清掉（见 ui/path-flow-table.js）。 -->
              <div class="pw-flow-body" id="pw-flow-body">
                <!-- 用 section 标签而不是 div：公约要求 div 嵌套 ≤ 5 层，
                     这一层再包一层就顶到 6 了（nt-app → pw-main → side-body → flow-body → grid）。
                     它本来也是一块区域，语义上更该是 section。
                     注：注释里别写 div 的尖括号写法 —— 门禁的嵌套计数连注释一起数。 -->
                <section class="pw-frozen">
                  <div class="pw-flow-grid pw-flow-filter">
                    <input class="pw-qf pw-qf-date" id="pw-qf-date" placeholder="日期" aria-label="日期筛选">
                    <input class="pw-qf" id="pw-qf-from" placeholder="转出" aria-label="转出账户">
                    <input class="pw-qf" id="pw-qf-to" placeholder="转入" aria-label="转入账户">
                    <input class="pw-qf" id="pw-qf-amount" placeholder="金额" aria-label="金额">
                    <input class="pw-qf" id="pw-qf-note" placeholder="备注" aria-label="备注">
                  </div>
                  <div class="pw-flow-grid pw-flow-head" id="pw-flow-head">
                    <span>序</span>
                    <span>日期</span>
                    <span>转出账户</span>
                    <span>转入账户</span>
                    <b>金额</b>
                    <span>备注</span>
                  </div>
                </section>
              </div>
            </div>
          </aside>

          <!-- 右：环网图 -->
          <section class="pw-chart" aria-label="资金环网图">
            <div class="pw-chart-inner" id="pw-chart"></div>
          </section>
        </div>

        <!-- 左上角常驻工具条：三角（收展左栏）+ 顺 / 逆一体切换 + Money Way。
             侧栏收展只改左栏宽度，这一条**不隐藏**（持续显示）——
             原「路径追踪」标题由它取代。点绘图区会自动收起左栏。
             必须放在 .pw-chart **外面**：那个容器带 transform，
             会给 fixed 定位重新造一个包含块，按钮就会跟着图跑到图中间去。 -->
        <div class="pw-tools">
          <button class="pw-toggle" type="button" id="pw-toggle"
                  aria-label="收起左侧信息栏">◀</button>
          <button class="pw-dir" type="button" id="pw-dir"
                  aria-label="追踪方向：逆流，点一下切到顺流"
                  title="追踪方向：逆流，点一下切到顺流">逆</button>
          <span class="pw-brand" id="pw-brand">Money Way</span>
        </div>
      </section>

      <!-- ============ 固定：固定收支 + 分期 ============ -->
      <section class="nt-view" data-view="plan" hidden>
        <div class="nt-vbar">
          <div class="nt-caps" id="nt-plan-caps">
            <button class="nt-cap" type="button" data-cap="fixed" aria-selected="true">固定收支</button>
            <button class="nt-cap" type="button" data-cap="inst" aria-selected="false">分期</button>
          </div>
        </div>
        <div class="nt-plan-fixed" id="nt-plan-fixed">
          <div class="nt-tablewrap">
            <table class="nt-table nt-table-plan">
                <thead>
                  <tr>
                    <th class="nt-th nt-c-seq" scope="col" data-col="seq">序</th>
                    <th class="nt-th nt-c-freq" scope="col" data-col="freq">频率</th>
                    <th class="nt-th nt-c-day" scope="col" data-col="day">日期</th>
                    <th class="nt-th" scope="col" data-col="from">转出账户</th>
                    <th class="nt-th" scope="col" data-col="to">转入账户</th>
                    <th class="nt-th nt-c-amount" scope="col" data-col="amount">金额</th>
                    <th class="nt-th" scope="col" data-col="note">备注</th>
                    <th class="nt-th nt-c-action nt-th-edge" scope="col" data-col="action">删除</th>
                  </tr>
                </thead>
              <tbody id="nt-plan-body"></tbody>
            </table>
          </div>
        </div>
        <div class="nt-plan-inst" id="nt-plan-inst" hidden>
          <div class="nt-tablewrap">
            <table class="nt-table nt-table-inst">

              <thead>
                <tr id="nt-inst-head">
                  <!-- 月份列由 JS 按 calcInstallmentMatrix 动态生成，这里只放固定列 -->
                  <th class="nt-th nt-c-inst-name" scope="col" data-col="name">账户名称</th>
                  <th class="nt-th nt-c-num" scope="col" data-col="principal">分期金额</th>
                  <th class="nt-th nt-c-seq" scope="col" data-col="periods">期数</th>
                  <th class="nt-th nt-c-day" scope="col" data-col="billDay">账单日</th>
                  <th class="nt-th nt-c-day" scope="col" data-col="repayDay">还款日</th>
                </tr>
              </thead>
              <tbody id="nt-inst-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- ============ 设置：账户结构 + 六个功能 ============ -->
      <section class="nt-view" data-view="settings" hidden>
        <div class="nt-vbar">
          <span class="nt-vbar-title">账本设置</span>
          <button class="nt-btn nt-btn-sm" type="button" data-act="balance">配平</button>
          <button class="nt-btn nt-btn-sm" type="button" data-act="password">密码</button>
          <button class="nt-btn nt-btn-sm" type="button" data-act="config">配置</button>
          <button class="nt-btn nt-btn-sm" type="button" data-act="reset">重置</button>
          <button class="nt-btn nt-btn-sm" type="button" data-act="theme">主题</button>
          <button class="nt-btn nt-btn-sm" type="button" data-act="layout">布局</button>
          <span class="nt-vbar-spacer"></span>
        </div>
        <div class="nt-tablewrap">
          <table class="nt-table nt-table-accounts">
            <thead>
                <tr>
                  <!-- 列顺序按核对过的设计：简码 · 序 · 类型 · 分类 · 名称 · 期初 · 账单日 · 还款日 · 上移 · 删除 -->
                  <th class="nt-th nt-c-code" scope="col" data-col="code">简码</th>
                  <th class="nt-th nt-c-seq" scope="col" data-col="seq">序</th>
                  <th class="nt-th nt-c-type" scope="col" data-col="type">类型</th>
                  <th class="nt-th nt-c-cat" scope="col" data-col="cat">分类</th>
                  <th class="nt-th nt-c-name" scope="col" data-col="name">账户名称</th>
                  <th class="nt-th nt-c-num" scope="col" data-col="opening">期初余额</th>
                  <th class="nt-th nt-c-day" scope="col" data-col="billDay">账单日</th>
                  <th class="nt-th nt-c-day" scope="col" data-col="repayDay">还款日</th>
                  <th class="nt-th nt-c-action nt-th-edge" scope="col" data-col="up">上移</th>
                  <th class="nt-th nt-c-action nt-th-edge" scope="col" data-col="action">删除</th>
                </tr>
            </thead>
            <tbody id="nt-accounts-body"></tbody>
          </table>
        </div>
      </section>

      <!-- ============ 校验：账本说明 / 账本校验 / 赞助感谢 ============ -->
      <section class="nt-view" data-view="validate" hidden>
        <div class="nt-vbar">
          <div class="nt-caps" id="nt-validate-caps">
            <button class="nt-cap" type="button" data-cap="about" aria-selected="true">账本说明</button>
            <button class="nt-cap" type="button" data-cap="check" aria-selected="false">账本校验</button>
            <button class="nt-cap" type="button" data-cap="thanks" aria-selected="false">赞助感谢</button>
          </div>
        </div>
        <div class="nt-validate-body" id="nt-validate-body"></div>
      </section>
    </main>

    <footer class="nt-footer" id="nt-footer"></footer>
  </div>

    <!-- 白屏兜底：模块加载失败（例如旧缓存指向已删文件）时给提示和重载按钮 -->
    <div id="nt-boot-fallback" hidden></div>
    <script>
      (function () {
        function show(msg) {
          var box = document.getElementById('nt-boot-fallback');
          if (!box || box.dataset.shown === '1') return;
          box.dataset.shown = '1';
          box.hidden = false;
          box.textContent = '';

          var t = document.createElement('div');
          t.className = 'nt-boot-fb-title';
          t.textContent = '页面没能启动';
          var d = document.createElement('div');
          d.className = 'nt-boot-fb-msg';
          d.textContent = msg;
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'nt-boot-fb-btn';
          b.textContent = '清缓存并重载';
          b.addEventListener('click', async function () {
            try {
              var names = await caches.keys();
              await Promise.all(names.map(function (n) { return caches.delete(n); }));
              var regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(function (r) { return r.unregister(); }));
            } catch (e) { /* 忽略 */ }
            // 带一个时间戳重新进：只清 Cache Storage 还不够 ——
            // index.html 自己也可能是浏览器 HTTP 缓存里的旧副本，
            // 直接 reload 会把它再读一遍，看起来像「清了个寂寞」。
            try {
              location.replace(location.pathname + '?fresh=' + Date.now());
            } catch (e) {
              location.reload();
            }
          });

          box.appendChild(t);
          box.appendChild(d);
          box.appendChild(b);
        }

        // 模块加载失败会触发 error（脚本层面）
        window.addEventListener('error', function (ev) {
          var t = ev && ev.target;
          if (t && t.tagName === 'SCRIPT') show('脚本加载失败：' + (t.src || ''));
        }, true);

        // 3.5 秒后还没出锁屏 / 主界面 = 没起来
        setTimeout(function () {
          var hasGate = document.querySelector('.lock-card, #nt-setup-form, #nt-lock-form');
          var hasApp = document.getElementById('nt-app');
          var appShown = hasApp && !hasApp.hidden;
          if (!hasGate && !appShown) {
            show('模块没有加载完。多半是旧缓存指向了已删除的文件，点下面的按钮清一次。');
          }
        }, 3500);

        window.__ntBootOk = function () {
          var box = document.getElementById('nt-boot-fallback');
          if (box) box.hidden = true;
        };
      })();
    </script>
</body>
</html>
