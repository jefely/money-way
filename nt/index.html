<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NT账本 · nt-v0.01</title>
  <meta name="theme-color" content="#6b5bc4">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/flow.css">
  <link rel="stylesheet" href="./css/gate.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <!-- 门禁：锁屏 / 设置密码（由 ui/gate.js 注入模板） -->
  <div class="nt-gate-host" id="nt-gate" hidden></div>

  <!-- 主界面：解锁后才显示 -->
  <div class="nt-app" id="nt-app" hidden>
    <header class="nt-header">
      <h1 class="nt-title">NT账本</h1>
      <span class="nt-version" id="nt-version">nt-v0.01</span>
    </header>

    <main class="nt-main">
      <!-- 校验区 -->
      <section class="nt-panel" aria-labelledby="nt-check-title">
        <h2 class="nt-panel-title" id="nt-check-title">校验</h2>
        <dl class="nt-checks">
          <dt class="nt-check-name">数据完整性</dt>
          <dd class="nt-check-value" id="nt-check-balanced">—</dd>
          <dt class="nt-check-name">会计恒等式</dt>
          <dd class="nt-check-value" id="nt-check-identity">—</dd>
        </dl>
        <p class="nt-hint" id="nt-check-detail"></p>
        <p class="nt-status" id="nt-status" role="status"></p>
      </section>

      <!-- 流水列表：行内直接编辑，末尾固定一行「新增」 -->
      <section class="nt-panel" aria-labelledby="nt-list-title">
        <h2 class="nt-panel-title" id="nt-list-title">流水</h2>
        <table class="nt-table">
          <thead>
            <tr>
              <th class="nt-th nt-cell-seq" scope="col">序</th>
              <th class="nt-th nt-cell-date" scope="col">日期</th>
              <th class="nt-th nt-cell-from" scope="col">转出</th>
              <th class="nt-th nt-cell-to" scope="col">转入</th>
              <th class="nt-th nt-cell-amount" scope="col">金额</th>
              <th class="nt-th nt-cell-note" scope="col">备注</th>
              <th class="nt-th nt-cell-action" scope="col"><span class="nt-visually-hidden">操作</span></th>
            </tr>
          </thead>
          <tbody id="nt-flow-body"></tbody>
        </table>
      </section>
    </main>

    <footer class="nt-footer" id="nt-footer"></footer>
  </div>

  <!-- 模板统一放在 templates/templates.html，由 js/ui/render-transactions.js 注入 -->
</body>
</html>
