<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NT账本 · 选择版本</title>
  <meta name="theme-color" content="#4c3d80">
  <link rel="stylesheet" href="./launcher.css">
  <script type="module" src="./launcher.js"></script>
</head>
<body>
  <header class="la-header">
    <h1 class="la-title">NT账本</h1>
    <p class="la-sub">同一本账的多个阶段，点一个进去</p>
  </header>

  <main class="la-main">
    <ul class="la-list" id="la-list"></ul>
    <p class="la-note" id="la-note" role="status">正在读取版本清单…</p>

  <footer class="la-footer">
    <span>各版本的数据与密码都在自己内部，互不共享</span>
  </footer>

</html>
